<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon site web</title>

    <style>
        .card {
    background: white;
    max-width: 600px;
    margin: 40px auto;
    padding: 30px;
    border-radius: 15px;
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
}

        h1 {
            color: #1e3a8a;
        }

        h2 {
            color: #2563eb;
        }

        p {
            color: #333;
            font-size: 18px;
        }

        button {
            background: #2563eb;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #1e40af;
        }
    </style>
</head>

<body>

    <div class="card">

    <h1>Bienvenue sur mon site !</h1>

<h2>Je m'appelle Alhoussainy</h2>

<p>Je suis en train d'apprendre le développement web.</p>

<h2>À propos de moi</h2>

<p>Je commence mon aventure avec HTML, CSS et JavaScript.</p>
        <button>Cliquer ici</button>

<script>
document.querySelector("button").addEventListener("click", function() {
    alert("Bienvenue sur mon site !");
});
</script>

</div>
</body>
</html>
