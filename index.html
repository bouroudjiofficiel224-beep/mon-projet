<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon site web</title>

    <style>
       body {
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #1e3a8a, #3b82f6);
    text-align: center;
    padding: 50px;
    margin: 0;
    min-height: 100vh;
}
        .card {
    background: white;
    max-width: 600px;
    margin: 40px auto;
    padding: 30px;
    border-radius: 15px;
            border: 1px solid #e5e7eb;
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
}
        .card:hover {
    transform: translateY(-5px);
    transition: 0.3s;
}

        h1 {
            color: #1e3a8a;
        }

        h2 {
            color: #2563eb;
        }

        p {
            color: #333;
            font-size: 18px;
        }

        button {
            background: #2563eb;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #1e40af;
        }
    </style>
</head>

<body>

    <div class="card">

   <h1>Bienvenue sur Nexa !</h1>

<h2>Nexa, votre nouvelle application</h2>
<p>Découvrez une nouvelle façon de simplifier votre quotidien.</p>

       <button>Découvrir Nexa</button>

<script>
document.querySelector("button").addEventListener("click", function() {
   alert("Bienvenue sur Nexa !");;
});
</script>

</div>
</body>
</html>
