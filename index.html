<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon site web</title>

    <style>
       body {
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #1e3a8a, #3b82f6);
    text-align: center;
    padding: 50px;
    margin: 0;
    min-height: 100vh;
}
        .card {
    background: white;
    max-width: 600px;
    margin: 40px auto;
    padding: 30px;
    border-radius: 15px;
            border: 1px solid #e5e7eb;
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
}
        .card:hover {
    transform: translateY(-5px);
    transition: 0.3s;
}

        h1 {
    color: #1e3a8a;
    font-size: 42px;
    margin-bottom: 15px;
}

        h2 {
            color: #2563eb;
        }

        p {
            color: #333;
            font-size: 18px;
        }

       button {
    background: #ffffff;
    color: #2563eb;
    border: 2px solid #2563eb;
    padding: 12px 30px;
    border-radius: 25px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.3s;
}

       button:hover {
    background: #1e40af;
    transform: scale(1.05);
}
    </style>
</head>

<body>

    <div class="card">

   <h1>Bienvenue sur Nexa !</h1>

<h2>Nexa, votre nouvelle application</h2>
<p>Découvrez une nouvelle façon de simplifier votre quotidien.</p>

       <button>Découvrir Nexa</button>
        <p id="message"></p>
<div id="services"></div>
<script>
document.querySelector("button").addEventListener("click", function() {

    document.getElementById("message").textContent =
        "Nexa est prête à vous servir et à vous accompagner dans vos projets.";

    document.getElementById("services").innerHTML = `
        <h3>Ce que Nexa peut vous offrir</h3>
        <p>📚 Apprendre et développer vos compétences</p>
        <p>🤖 Être accompagné par l’intelligence artificielle</p>
        <p>🛠️ Créer et gérer vos projets</p>
        <p>👥 Apprendre et collaborer avec une communauté</p>
        <p>💼 Découvrir des opportunités</p>
    `;
});
</script>

</div>
</body>
</html>
